[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
# Same settings Uniswap ships v4 with; PoolManager only fits under EIP-170 this way.
optimizer_runs = 44444444
via_ir = true
bytecode_hash = "none"
ffi = false
gas_limit = "3000000000"
fs_permissions = [{ access = "read", path = "./out" }, { access = "read-write", path = "./deployments" }]

# PositionManager only fits under EIP-170 at 500 runs (same restriction v4-periphery uses).
additional_compiler_profiles = [
  { name = "posm", via_ir = true, optimizer_runs = 500 },
  { name = "vault", via_ir = true, optimizer_runs = 200 },
]
# LPGrantVault and GraduationManager also only fit at low runs; all three are deployed from their artifacts (see
# script/lib/*Artifact.sol), so nothing else is compiled at their settings. GraduationManager runs once per launch,
# so the extra gas from fewer optimizer runs does not matter.
compilation_restrictions = [
  { paths = "lib/v4-periphery/src/PositionManager.sol", via_ir = true, optimizer_runs = 500 },
  { paths = "src/grant/LPGrantVault.sol", via_ir = true, optimizer_runs = 200 },
  { paths = "src/graduation/GraduationManager.sol", via_ir = true, optimizer_runs = 200 },
]

[profile.default.fuzz]
runs = 512
seed = "0x5045524b"

[profile.ci]
fuzz = { runs = 5000 }

# Fork tests against X Layer are opt-in: `FOUNDRY_PROFILE=fork forge test --match-path 'test/fork/**'`
[profile.fork]
test = "test/fork"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
xlayer = "https://xlayer-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
xlayer_testnet = "https://xlayer-testnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"

# OKLink verification needs no account; any key string works.
[etherscan]
xlayer = { key = "${XLAYER_EXPLORER_API_KEY}", url = "https://www.oklink.com/api/v5/explorer/contract/verify-source-code-plugin/XLAYER", chain = 196 }
xlayer_testnet = { key = "${XLAYER_EXPLORER_API_KEY}", url = "https://www.oklink.com/api/v5/explorer/contract/verify-source-code-plugin/XLAYER_TESTNET", chain = 1952 }
